name: My First DevOps Pipeline

on:
  - push

jobs:
  verify-system:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Run Linux Health & Script Check
        run: |
          pwd
          ls -la
          mkdir -p build && cd build
          echo 'echo "Pipeline works!"' > start.sh
          chmod +x start.sh
          ./start.sh
